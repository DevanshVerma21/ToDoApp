<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Pane - Task List -->
        <div class="left-pane">
            <h2>My Tasks</h2>
            <div id="task-list" class="task-list">
                <!-- Tasks will be dynamically added here -->
            </div>
        </div>

        <!-- Right Pane - Task Input -->
        <div class="right-pane">
            <h2>Add New Task</h2>
            <div class="task-input-container">
                <textarea id="task-input" placeholder="Enter your task here and press ENTER to add..." rows="8"></textarea>
                <p class="instruction-text">Press ENTER to add task</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
